name: Build CPS Production Bundle

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'terms.html'
      - 'logo.jpg'
      - 'CNAME'
      - '.nojekyll'
      - 'portal/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Create production bundle
        run: |
          zip -r CPS_Portal_Production_Bundle.zip index.html terms.html logo.jpg CNAME .nojekyll portal

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: CPS-Portal-Production-Bundle
          path: CPS_Portal_Production_Bundle.zip
          retention-days: 30
